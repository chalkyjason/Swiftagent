# Swiftagent — Local LLM setup via Ollama (LLaMA)
#
# Quick start:
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.1:8b
#
# Then run OpenClaw with:
#   python -m OpenClaw --local --local-model llama3.1:8b
#
# Other recommended models:
#   docker compose exec ollama ollama pull llama3.2:3b      # Lightweight (~4GB VRAM)
#   docker compose exec ollama ollama pull llama3.1:70b     # High quality (~40GB VRAM)
#   docker compose exec ollama ollama pull codellama:13b    # Code-focused (~10GB VRAM)
#
# GPU support:
#   NVIDIA: Works out of the box with nvidia-container-toolkit
#   AMD:   Uncomment the AMD section below and comment out the NVIDIA one
#   CPU:   Remove the deploy section entirely (will be slow)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: swiftagent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

    # NVIDIA GPU (default) — requires nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # AMD GPU — uncomment below, comment out NVIDIA section above
    # devices:
    #   - /dev/kfd
    #   - /dev/dri

    # CPU only — remove the entire 'deploy' section above

volumes:
  ollama_data:
