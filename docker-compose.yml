# Swiftagent — Local LLM setup via Ollama (Docker)
#
# NOTE: This Docker setup is for Linux/Windows with NVIDIA or AMD GPUs.
# On Apple Silicon (M1/M2/M3/M4), install Ollama natively instead:
#   brew install ollama && ollama serve &
# Docker on Mac runs in a VM and CANNOT access the Apple GPU.
#
# Quick start (Linux/Windows):
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.1:8b
#   python -m OpenClaw --local --local-model llama3.1:8b
#
# GPU support:
#   NVIDIA: Works out of the box with nvidia-container-toolkit
#   AMD:   Uncomment the AMD section below and comment out the NVIDIA one
#   CPU:   Remove the deploy section entirely (will be slow)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: swiftagent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

    # NVIDIA GPU (default) — requires nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # AMD GPU — uncomment below, comment out NVIDIA section above
    # devices:
    #   - /dev/kfd
    #   - /dev/dri

    # CPU only — remove the entire 'deploy' section above

volumes:
  ollama_data:
