name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    name: OpenClaw Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenClaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=. --cov-report=term-missing

  dotnet-build:
    name: AgentUI Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore AgentUI/AgentUI.csproj

      - name: Build
        run: dotnet build AgentUI/AgentUI.csproj --no-restore -f net8.0-android

  dotnet-tests:
    name: AgentUI ViewModel Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AgentUI.Tests/AgentUI.Tests.csproj

      - name: Test
        run: dotnet test AgentUI.Tests/AgentUI.Tests.csproj --logger "console;verbosity=normal"
